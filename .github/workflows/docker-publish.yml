name: Build and publish Docker images

on:
  workflow_dispatch:

env:
  REGISTRY: registry.birtan.dev
  WEB_IMAGE_NAME: ai-diary-web
  API_IMAGE_NAME: ai-diary-api
  COOLIFY_URL: https://containers.birtan.dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SPA bakes the Keycloak address in at build time; without it the
      # image would point at the localhost dev default.
      - name: Check Keycloak build variables
        run: |
          if [ -z "${{ vars.KEYCLOAK_URL }}" ]; then
            echo "::error::Set the KEYCLOAK_URL repository variable (Settings → Secrets and variables → Actions → Variables), e.g. https://auth.example.com"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build context is the repo root for both images — each Dockerfile
      # COPYs from paths outside its own directory (web/Dockerfile reaches
      # into web/, the API Dockerfile reaches into src/).
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=${{ vars.KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.KEYCLOAK_REALM || 'diary' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID || 'diary-web' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AiDiary.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  trigger-redeploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl -fsSL -X POST \
            "${{ env.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
