name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      build_keycloak:
        description: 'Also build the shared Keycloak image (realm/theme changes)'
        type: boolean
        default: false

env:
  REGISTRY: registry.birtan.dev
  WEB_IMAGE_NAME: ai-diary-web
  API_IMAGE_NAME: ai-diary-api
  # Deliberately not ai-diary-*: this identity server is shared across projects.
  KEYCLOAK_IMAGE_NAME: identity
  COOLIFY_URL: https://containers.birtan.dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build context is the repo root for both images — each Dockerfile
      # COPYs from paths outside its own directory (web/Dockerfile reaches
      # into web/, the API Dockerfile reaches into src/).
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AiDiary.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Keycloak's Dockerfile COPYs realm-export.json and themes/ relative
      # to its own folder, so the build context is keycloak/, not the repo root.
      - name: Build and push keycloak
        if: ${{ inputs.build_keycloak }}
        uses: docker/build-push-action@v6
        with:
          context: keycloak
          file: keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.KEYCLOAK_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.KEYCLOAK_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

  trigger-redeploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl -fsSL -X POST \
            "${{ env.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
