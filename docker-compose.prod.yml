# AI Diary — production stack, deployed via Coolify.
#
# Unlike docker-compose.yml (local dev), this pulls pre-built images from the
# registry instead of building, and assumes object storage (S3/R2/B2/etc.)
# and the embedding model (Ollama) are run elsewhere — set DIARY_S3_* to
# point at the bucket. Postgres is the only stateful service actually run by
# this stack.
#
# Ollama runs in another stack on its private network. The api joins that
# network as an external one (OLLAMA_NETWORK) and reaches Ollama by its
# `ollama` alias there; no Ollama port is published.
#
# No insecure fallback defaults here: every secret and every
# deployment-specific URL must be set in Coolify's environment variables for
# this resource, or the stack will refuse to start.
#
# Keycloak is not part of this stack: it's the shared identity server,
# deployed from its own repository as a separate Coolify resource, and
# reached over its public URL.
#
# Assign public domains to web and api from Coolify's per-service
# settings — this file intentionally does not publish host ports.

name: ai-diary

x-api-environment: &api-env
  DIARY_MASTER_KEY: ${DIARY_MASTER_KEY:?DIARY_MASTER_KEY is required — generate with openssl rand -base64 32}
  DIARY_DB_CONNECTION: Host=diary-postgres;Port=5432;Database=${POSTGRES_DB:-diary};Username=${POSTGRES_USER:-diary};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DIARY_S3_ENDPOINT: ${DIARY_S3_ENDPOINT:?DIARY_S3_ENDPOINT is required (your S3-compatible provider)}
  DIARY_S3_PUBLIC_ENDPOINT: ${DIARY_S3_PUBLIC_ENDPOINT:?DIARY_S3_PUBLIC_ENDPOINT is required — the browser downloads note bodies directly from here}
  DIARY_S3_REGION: ${DIARY_S3_REGION:?DIARY_S3_REGION is required}
  DIARY_S3_BUCKET: ${DIARY_S3_BUCKET:?DIARY_S3_BUCKET is required}
  DIARY_S3_ACCESS_KEY: ${DIARY_S3_ACCESS_KEY:?DIARY_S3_ACCESS_KEY is required}
  DIARY_S3_SECRET_KEY: ${DIARY_S3_SECRET_KEY:?DIARY_S3_SECRET_KEY is required}
  DIARY_S3_FORCE_PATH_STYLE: ${DIARY_S3_FORCE_PATH_STYLE:-true}
  DIARY_S3_PRESIGN_TTL_SECONDS: ${DIARY_S3_PRESIGN_TTL_SECONDS:-300}
  DIARY_OLLAMA_URL: ${DIARY_OLLAMA_URL:-http://ollama:11434}
  DIARY_EMBED_MODEL: ${DIARY_EMBED_MODEL:-bge-m3}
  DIARY_OIDC_AUTHORITY: ${DIARY_OIDC_AUTHORITY:?DIARY_OIDC_AUTHORITY is required — the public Keycloak URL, e.g. https://auth.example.com/realms/diary}
  # Empty = reach Keycloak via DIARY_OIDC_AUTHORITY (the public URL). Set it
  # only if this stack shares a Docker network with the identity server,
  # e.g. http://keycloak:8080.
  DIARY_OIDC_INTERNAL_URL: ${DIARY_OIDC_INTERNAL_URL:-}
  DIARY_OIDC_CLIENT_ID: ${DIARY_OIDC_CLIENT_ID:-diary-api}
  DIARY_OIDC_CLIENT_SECRET: ${DIARY_OIDC_CLIENT_SECRET:?DIARY_OIDC_CLIENT_SECRET is required — same value as DIARY_REALM_API_CLIENT_SECRET on the identity deployment}
  DIARY_OIDC_AUDIENCE: ${DIARY_OIDC_AUDIENCE:-diary-web}
  DIARY_ADMIN_EMAIL: ${DIARY_ADMIN_EMAIL:?DIARY_ADMIN_EMAIL is required}
  DIARY_CAPTCHA_PROVIDER: ${DIARY_CAPTCHA_PROVIDER:-none}
  DIARY_CAPTCHA_SECRET: ${DIARY_CAPTCHA_SECRET:-}
  DIARY_CAPTCHA_SITE_KEY: ${DIARY_CAPTCHA_SITE_KEY:-}
  DIARY_VERSION_RETENTION_DAYS: ${DIARY_VERSION_RETENTION_DAYS:-90}
  DIARY_TRASH_RETENTION_DAYS: ${DIARY_TRASH_RETENTION_DAYS:-30}
  DIARY_CONVERSATION_RETENTION_DAYS: ${DIARY_CONVERSATION_RETENTION_DAYS:-30}
  DIARY_NIGHTLY_RUN_TIME: ${DIARY_NIGHTLY_RUN_TIME:-02:00}
  DIARY_NIGHTLY_RUN_TZ: ${DIARY_NIGHTLY_RUN_TZ:-Europe/Amsterdam}
  DIARY_CORS_ORIGINS: ${DIARY_CORS_ORIGINS:?DIARY_CORS_ORIGINS is required — the public web app URL}
  DIARY_BASE_URL: ${DIARY_BASE_URL:?DIARY_BASE_URL is required — the public API URL}
  DIARY_SMTP_HOST: ${DIARY_SMTP_HOST:?DIARY_SMTP_HOST is required}
  DIARY_SMTP_PORT: ${DIARY_SMTP_PORT:-587}
  DIARY_SMTP_USERNAME: ${DIARY_SMTP_USERNAME:-}
  DIARY_SMTP_PASSWORD: ${DIARY_SMTP_PASSWORD:-}
  DIARY_SMTP_FROM: ${DIARY_SMTP_FROM:?DIARY_SMTP_FROM is required}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-diary}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        # The api also sits on the Ollama network, which may have its own
        # `postgres`; a unique alias keeps the api pointed at this one.
        aliases:
          - diary-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diary} -d ${POSTGRES_DB:-diary}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${REGISTRY:-registry.birtan.dev}/${API_IMAGE_NAME:-ai-diary-api}:${IMAGE_TAG:-latest}
    # Every publish reuses the `latest` tag, so without this a redeploy can
    # keep running the cached image instead of the one just pushed.
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - ollama
    expose:
      - "8080"
    # Liveness, not /health/ready: readiness includes Ollama and object
    # storage, and an outage there shouldn't mark the api unhealthy (Traefik
    # stops routing to unhealthy containers). start_period covers migrations.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: ${REGISTRY:-registry.birtan.dev}/${WEB_IMAGE_NAME:-ai-diary-web}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ollama:
    # The Ollama stack's network as `docker network ls` shows it; under
    # Coolify that is usually prefixed with its resource UUID (<uuid>_ai-net).
    external: true
    name: ${OLLAMA_NETWORK:-ai-net}

volumes:
  postgres-data:
