# AI Diary — local development stack.
#
# Profiles:
#   dev     MinIO (S3 stand-in), Mailpit (SMTP), bucket creation, one-shot seed
#   ollama  Real Ollama + bge-m3 pull (embeddings are hard to fake usefully)
#
# Keycloak is not part of this app: it's the shared identity server from the
# separate identity repository. Start its dev stack first (it listens on
# localhost:8082); the browser uses that address and the containers here reach
# it through host.docker.internal.
#
# Everything except the API sits on the private network.
# In production this is deployed via Coolify; only web + API get exposed.

name: ai-diary

x-api-environment: &api-env
  DIARY_MASTER_KEY: ${DIARY_MASTER_KEY:?DIARY_MASTER_KEY_is_required__generate_with_openssl_rand_-base64_32}
  DIARY_DB_CONNECTION: Host=postgres;Port=5432;Database=diary;Username=${POSTGRES_USER:-diary};Password=${POSTGRES_PASSWORD:-diary}
  DIARY_S3_ENDPOINT: ${DIARY_S3_ENDPOINT:-http://minio:9000}
  DIARY_S3_PUBLIC_ENDPOINT: ${DIARY_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  DIARY_S3_REGION: ${DIARY_S3_REGION:-eu-central-1}
  DIARY_S3_BUCKET: ${DIARY_S3_BUCKET:-diary}
  DIARY_S3_ACCESS_KEY: ${DIARY_S3_ACCESS_KEY:-minioadmin}
  DIARY_S3_SECRET_KEY: ${DIARY_S3_SECRET_KEY:-minioadmin}
  DIARY_S3_FORCE_PATH_STYLE: ${DIARY_S3_FORCE_PATH_STYLE:-true}
  DIARY_S3_PRESIGN_TTL_SECONDS: ${DIARY_S3_PRESIGN_TTL_SECONDS:-300}
  DIARY_OLLAMA_URL: ${DIARY_OLLAMA_URL:-http://ollama:11434}
  DIARY_EMBED_MODEL: ${DIARY_EMBED_MODEL:-bge-m3}
  DIARY_OIDC_AUTHORITY: ${DIARY_OIDC_AUTHORITY:-http://localhost:8082/realms/diary}
  DIARY_OIDC_INTERNAL_URL: ${DIARY_OIDC_INTERNAL_URL:-http://host.docker.internal:8082}
  DIARY_OIDC_CLIENT_ID: ${DIARY_OIDC_CLIENT_ID:-diary-api}
  DIARY_OIDC_CLIENT_SECRET: ${DIARY_OIDC_CLIENT_SECRET:-dev-admin-secret-change-me}
  DIARY_OIDC_AUDIENCE: ${DIARY_OIDC_AUDIENCE:-diary-web}
  DIARY_ADMIN_EMAIL: ${DIARY_ADMIN_EMAIL:-admin@example.com}
  DIARY_CAPTCHA_PROVIDER: ${DIARY_CAPTCHA_PROVIDER:-none}
  DIARY_CAPTCHA_SECRET: ${DIARY_CAPTCHA_SECRET:-}
  DIARY_CAPTCHA_SITE_KEY: ${DIARY_CAPTCHA_SITE_KEY:-}
  DIARY_VERSION_RETENTION_DAYS: ${DIARY_VERSION_RETENTION_DAYS:-90}
  DIARY_TRASH_RETENTION_DAYS: ${DIARY_TRASH_RETENTION_DAYS:-30}
  DIARY_CONVERSATION_RETENTION_DAYS: ${DIARY_CONVERSATION_RETENTION_DAYS:-30}
  DIARY_NIGHTLY_RUN_TIME: ${DIARY_NIGHTLY_RUN_TIME:-02:00}
  DIARY_NIGHTLY_RUN_TZ: ${DIARY_NIGHTLY_RUN_TZ:-Europe/Amsterdam}
  DIARY_CORS_ORIGINS: ${DIARY_CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
  DIARY_BASE_URL: ${DIARY_BASE_URL:-http://localhost:8080}
  DIARY_SMTP_HOST: ${DIARY_SMTP_HOST:-mailpit}
  DIARY_SMTP_PORT: ${DIARY_SMTP_PORT:-1025}
  DIARY_SMTP_FROM: ${DIARY_SMTP_FROM:-diary@localhost}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diary}
      POSTGRES_DB: ${POSTGRES_DB:-diary}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diary} -d diary"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ${DIARY_S3_BUCKET:-diary}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "sleep 5; OLLAMA_HOST=ollama:11434 ollama pull bge-m3"

  api:
    build:
      context: .
      dockerfile: src/AiDiary.Api/Dockerfile
    environment:
      <<: *api-env
    # Reach the identity stack published on the host (localhost:8082).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Liveness, not /health/ready: readiness includes Ollama, which is an
    # optional profile here. start_period covers migrations.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  seed:
    build:
      context: .
      dockerfile: src/AiDiary.Api/Dockerfile
    profiles: ["dev"]
    command: ["dotnet", "AiDiary.Api.dll", "seed"]
    environment:
      <<: *api-env
    # Reach the identity stack published on the host (localhost:8082).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
  ollama-data:
